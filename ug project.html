<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Under Progress</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@500;700&display=swap');
        
        :root {
            --primary: #ffd700;
            --secondary: #d4af37;
            --dark: #000000;
            --light: #f8f9fa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }
        
        .dots {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .dot {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(var(--primary), var(--secondary));
            filter: blur(5px);
            opacity: 0.2;
            animation: float 10s infinite ease-in-out;
            box-shadow: 0 0 15px var(--primary);
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary);
            animation: glow 2s infinite alternate;
            background: linear-gradient(90deg, #ffd700, #d4af37, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary);
                background-position: 0% center;
            }
            to {
                text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary);
                background-position: 100% center;
            }
        }
        
        .status-container {
            position: relative;
            margin: 50px auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }
        
        .status-container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, var(--primary), var(--secondary), transparent 30%);
            animation: rotate 4s linear infinite;
        }
        
        .status-container::after {
            content: "";
            position: absolute;
            inset: 2px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 13px;
            z-index: -1;
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--light);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .typing-animation {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid var(--primary);
            animation: typing 4s steps(20) infinite, blink 0.7s step-end infinite;
        }
        
        @keyframes typing {
            0%, 45%, 100% {
                width: 0;
            }
            15%, 30% {
                width: 100%;
            }
        }
        
        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }
        
        .code-block {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            text-align: left;
            max-width: 400px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        
        .code-line {
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        
        .code-line:nth-child(1) { animation-delay: 0.5s; }
        .code-line:nth-child(2) { animation-delay: 1.0s; }
        .code-line:nth-child(3) { animation-delay: 1.5s; }
        .code-line:nth-child(4) { animation-delay: 2.0s; }
        .code-line:nth-child(5) { animation-delay: 2.5s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .code-comment {
            color: #6c757d;
        }
        
        .code-keyword {
            color: #ffd700;
        }
        
        .code-string {
            color: #d4af37;
        }
        
        .code-function {
            color: #f5cc7f;
        }
        
        .time-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        
        .time-segment {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            width: 80px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .time-value {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
        }
        
        .time-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }
        
        footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 28px;
            }
            
            .status-text {
                font-size: 22px;
            }
            
            .time-segment {
                width: 60px;
            }
            
            .time-value {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="dots" id="dots"></div>
    </div>
    
    <div class="container">
        <div class="logo">Quantum Nexus</div>
        
        <div class="status-container">
            <div class="status-text">
                <div class="typing-animation">Launching Soon</div>
            </div>
            
            <div class="time-container" id="countdown">
                <div class="time-segment">
                    <div class="time-value" id="days">00</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-segment">
                    <div class="time-value" id="hours">00</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-segment">
                    <div class="time-value" id="minutes">00</div>
                    <div class="time-label">Minutes</div>
                </div>
                <div class="time-segment">
                    <div class="time-value" id="seconds">00</div>
                    <div class="time-label">Seconds</div>
                </div>
            </div>
        </div>
        
        <footer>
            Last updated: <span id="lastUpdated"></span>
        </footer>
    </div>

    <script>
        // Create animated background dots
        function createDots() {
            const dotsContainer = document.getElementById('dots');
            const numberOfDots = 15;
            
            for (let i = 0; i < numberOfDots; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                
                // Random size
                const size = Math.random() * 200 + 50;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                
                // Random position
                dot.style.left = `${Math.random() * 100}%`;
                dot.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration and delay
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                dot.style.animationDuration = `${duration}s`;
                dot.style.animationDelay = `${delay}s`;
                
                dotsContainer.appendChild(dot);
            }
        }
        
        // Set the last updated date
        function updateLastUpdated() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('lastUpdated').textContent = now.toLocaleDateString('en-US', options);
        }
        
        // Set countdown timer to a date 30 days from now
        function startCountdown() {
            const now = new Date();
            const targetDate = new Date();
            targetDate.setDate(now.getDate() + 30);
            
            function updateCountdown() {
                const currentTime = new Date();
                const difference = targetDate - currentTime;
                
                if (difference <= 0) {
                    document.getElementById('days').textContent = '00';
                    document.getElementById('hours').textContent = '00';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    return;
                }
                
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }
        
        // Initialize the page
        window.onload = function() {
            createDots();
            updateLastUpdated();
            startCountdown();
        };
    </script>
</body>
</html>
